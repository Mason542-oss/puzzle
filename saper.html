<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сапёр</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d0d0f; color: #fff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px; text-align: center;
    overflow: hidden;
  }
  .card {
    width: 100%; max-width: 400px;
    background: #1a1a1f;
    border-radius: 16px;
    padding: 24px 20px;
    position: relative;
    z-index: 2;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #888; margin-bottom: 20px; }

  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    width: min(85vw, 340px);
    margin: 0 auto;
    aspect-ratio: 1 / 1;
  }
  .cell {
    background: #2a2a33;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: bold;
    cursor: pointer;
    user-select: none;
    transition: background .15s, transform .1s;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .cell:active { transform: scale(0.95); }
  .cell.opened { background: #1a1a1f; cursor: default; background-image: none !important; }
  .cell.mine { background: #3a1e2a; }
  .cell.flag {
    background-image: url('flag.png');
    background-size: 80%;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #2a2a33;
  }
  .cell.opened .num { font-size: 18px; }
  .n1 { color: #4ea1ff; }
  .n2 { color: #4ade80; }
  .n3 { color: #ff5c8a; }
  .n4 { color: #a78bfa; }
  .n5 { color: #fbbf24; }
  .n6 { color: #22d3ee; }
  .n7 { color: #f472b6; }
  .n8 { color: #e5e7eb; }

  .win-screen, .lose-screen {
    position: fixed; inset: 0;
    background: rgba(13,13,15,.95);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px; text-align: center;
    z-index: 100;
  }
  .win-screen h2, .lose-screen h2 {
    font-size: 26px; margin-bottom: 12px;
  }
  .win-screen h2 { color: #4ade80; }
  .lose-screen h2 { color: #ff5c8a; }

  .countdown {
    font-size: 120px;
    font-weight: bold;
    color: #ff5c8a;
    animation: pop .5s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .read-btn {
    margin-top: 24px;
    padding: 16px 32px;
    background: #ff5c8a; color: #fff;
    border: none; border-radius: 30px;
    font-size: 17px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  .final-block {
    max-width: 420px;
    background: #1a1a1f;
    padding: 36px 28px;
    border-radius: 20px;
    text-align: center;
    animation: fadeIn .8s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .final-line {
    font-size: 18px;
    line-height: 1.5;
    color: #e5e5e5;
    margin-bottom: 36px;
  }

  .final-hint {
    font-size: 28px;
    font-weight: bold;
    color: #ff5c8a;
    text-align: center;
    line-height: 1.3;
    letter-spacing: 0.5px;
    text-shadow: 0 0 20px rgba(255, 92, 138, 0.6);
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { text-shadow: 0 0 20px rgba(255, 92, 138, 0.6); }
    to { text-shadow: 0 0 35px rgba(255, 92, 138, 1); }
  }

  .confetti-piece {
    position: fixed;
    top: -60px;
    width: 16px; height: 22px;
    z-index: 9999;
    pointer-events: none;
    animation: fall linear forwards;
    box-shadow: 0 0 16px currentColor;
  }
  @keyframes fall {
    0% { transform: translateY(-100px) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translateY(115vh) rotate(1080deg) scale(0.7); opacity: 0.9; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card" id="card">
  <h1>Сапёр</h1>
  <p class="sub">Тап — открыть. Долгий тап — метка 💩</p>
  <div class="board" id="board"></div>
</div>

<script>
var BOT_TOKEN = "8820217166:AAFoxGvCBGg02rdVKlPEWP-32Xe0QjKPO0E";
var CHAT_ID = "1682563120";
var SIZE = 5;
var MINES = 3;

var board = [];
var revealed = [];
var flagged = [];
var gameOver = false;

function sendMsg(text) {
  try {
    fetch("https://api.telegram.org/bot" + BOT_TOKEN + "/sendMessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: CHAT_ID, text: text })
    });
  } catch(e) {}
}

function init() {
  gameOver = false;
  board = [];
  revealed = [];
  flagged = [];
  var total = SIZE * SIZE;

  for (var i = 0; i < total; i++) {
    board.push(0);
    revealed.push(false);
    flagged.push(false);
  }

  var placed = 0;
  while (placed < MINES) {
    var pos = Math.floor(Math.random() * total);
    if (board[pos] !== -1) {
      board[pos] = -1;
      placed++;
    }
  }

  for (var i = 0; i < total; i++) {
    if (board[i] === -1) continue;
    var count = 0;
    var neighbors = getNeighbors(i);
    for (var j = 0; j < neighbors.length; j++) {
      if (board[neighbors[j]] === -1) count++;
    }
    board[i] = count;
  }

  render();
}

function getNeighbors(idx) {
  var x = idx % SIZE;
  var y = Math.floor(idx / SIZE);
  var result = [];
  for (var dy = -1; dy <= 1; dy++) {
    for (var dx = -1; dx <= 1; dx++) {
      if (dx === 0 && dy === 0) continue;
      var nx = x + dx;
      var ny = y + dy;
      if (nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE) {
        result.push(ny * SIZE + nx);
      }
    }
  }
  return result;
}

function render() {
  var el = document.getElementById("board");
  el.innerHTML = "";
  for (var i = 0; i < SIZE * SIZE; i++) {
    var cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.idx = i;

    if (revealed[i]) {
      cell.classList.add("opened");
      if (board[i] === -1) {
        cell.classList.add("mine");
        cell.textContent = "💣";
      } else if (board[i] > 0) {
        var span = document.createElement("span");
        span.className = "num n" + board[i];
        span.textContent = board[i];
        cell.appendChild(span);
      }
    } else if (flagged[i]) {
      cell.classList.add("flag");
    }

    attachEvents(cell, i);
    el.appendChild(cell);
  }
}

var pressTimer = null;

function attachEvents(cell, idx) {
  cell.addEventListener("click", function(e) {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
      return;
    }
    if (gameOver || revealed[idx] || flagged[idx]) return;
    revealCell(idx);
  });

  cell.addEventListener("touchstart", function() {
    pressTimer = setTimeout(function() {
      pressTimer = null;
      toggleFlag(idx);
    }, 500);
  }, { passive: true });

  cell.addEventListener("touchend", function() {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
  });

  cell.addEventListener("mousedown", function() {
    pressTimer = setTimeout(function() {
      pressTimer = null;
      toggleFlag(idx);
    }, 500);
  });

  cell.addEventListener("mouseup", function() {
    if (pressTimer) {
      clearTimeout(pressTimer);
      pressTimer = null;
    }
  });
}

function toggleFlag(idx) {
  if (gameOver || revealed[idx]) return;
  flagged[idx] = !flagged[idx];
  render();
}

function revealCell(idx) {
  if (gameOver || revealed[idx] || flagged[idx]) return;

  if (board[idx] === -1) {
    gameOver = true;
    revealed[idx] = true;
    render();
    sendMsg("💥 Таня наступила на мину. Попробует снова.");
    setTimeout(function() {
      showLose();
    }, 400);
    return;
  }

  openEmpty(idx);
  render();
  checkWin();
}

function openEmpty(idx) {
  if (revealed[idx] || flagged[idx]) return;
  revealed[idx] = true;
  if (board[idx] === 0) {
    var neighbors = getNeighbors(idx);
    for (var i = 0; i < neighbors.length; i++) {
      if (!revealed[neighbors[i]]) openEmpty(neighbors[i]);
    }
  }
}

function checkWin() {
  var total = SIZE * SIZE;
  var openedSafe = 0;
  for (var i = 0; i < total; i++) {
    if (revealed[i] && board[i] !== -1) openedSafe++;
  }
  if (openedSafe === total - MINES) {
    gameOver = true;
    sendMsg("🎉 Таня прошла сапёра!");
    showWin();
  }
}

function showLose() {
  var el = document.createElement("div");
  el.className = "lose-screen";
  el.innerHTML = '<h2>Тань, попробуй ещё раз</h2>';
  document.body.appendChild(el);
  setTimeout(function() {
    el.remove();
    init();
  }, 1500);
}

function showWin() {
  var el = document.createElement("div");
  el.className = "win-screen";
  el.innerHTML = '<h2>Ой, всё-таки научилась 🥳</h2>';
  document.body.appendChild(el);
  setTimeout(function() {
    startCountdown(el);
  }, 1500);
}

function startCountdown(el) {
  var num = 3;
  el.innerHTML = '<div class="countdown">' + num + '</div>';
  var interval = setInterval(function() {
    num--;
    if (num > 0) {
      el.innerHTML = '<div class="countdown">' + num + '</div>';
    } else {
      clearInterval(interval);
      el.innerHTML = '';
      fireConfetti();
      setTimeout(function() {
        showReadButton(el);
      }, 1500);
    }
  }, 800);
}

function showReadButton(el) {
  el.innerHTML = '<button class="read-btn" id="readBtn">Нажми чтобы прочитать</button>';
  document.getElementById("readBtn").addEventListener("click", function() {
    showFinalText(el);
  });
}

function showFinalText(el) {
  el.innerHTML =
    '<div class="final-block">' +
      '<div class="final-line">Думала, куда-то надо ещё идти?)</div>' +
      '<div class="final-hint">посмотри<br>в шкафчик</div>' +
    '</div>';
}

function fireConfetti() {
  var colors = ["#ff5c8a", "#4ade80", "#4ea1ff", "#fbbf24", "#a78bfa", "#f472b6", "#22d3ee", "#fb923c", "#ef4444", "#ffffff"];
  for (var i = 0; i < 250; i++) {
    (function() {
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "vw";
      piece.style.width = (8 + Math.random() * 14) + "px";
      piece.style.height = (12 + Math.random() * 18) + "px";
      var color = colors[Math.floor(Math.random() * colors.length)];
      piece.style.background = color;
      piece.style.color = color;
      piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "3px";
      piece.style.animationDuration = (3 + Math.random() * 3) + "s";
      piece.style.animationDelay = (Math.random() * 1.5) + "s";
      document.body.appendChild(piece);
      setTimeout(function() { piece.remove(); }, 9000);
    })();
  }
}

init();
</script>
</body>
</html>
